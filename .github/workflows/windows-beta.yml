name: Baby On Screen - Windows beta

on:
  push:
    branches: [master, feat/revival-windows-2026]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test

  windows-build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - name: Build installer and portable EXE
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Validate both Windows executables
        shell: pwsh
        run: ./scripts/verify-windows-artifacts.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: baby-on-screen-windows-beta
          path: dist/*.exe
          if-no-files-found: error
      - name: Smoke test actual Windows Electron UI
        continue-on-error: true
        run: node scripts/windows-app-smoke.cjs
      - name: Upload Windows UI snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baby-windows-visual-check
          path: dist/windows-*-smoke.png
          if-no-files-found: ignore
