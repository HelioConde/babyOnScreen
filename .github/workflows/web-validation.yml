name: Baby On Screen - Web validation

on:
  push:
    branches: [feat/revival-windows-2026, gh-pages]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - name: Verify public Pages entrypoint and local assets
        shell: bash
        run: |
          test -f index.html
          test -f web/index.html
          test -f web/style.css
          test -f web/app.js
          test -f engine.js
          test -f sprits/char1.png
          test -f som/rindo.mp3
