name: Baby On Screen - Release Windows on version bump

on:
  push:
    branches: [master]
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: baby-on-screen-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Identify new stable release
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content -Raw -LiteralPath package.json | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Expected a stable version x.y.z, got: $version" }
          $tag = "v$version"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { "needs_publish=false" >> $env:GITHUB_OUTPUT }
          else { "needs_publish=true" >> $env:GITHUB_OUTPUT }
          exit 0
      - name: Install dependencies
        if: steps.release.outputs.needs_publish == 'true'
        run: npm install --no-audit --no-fund
      - name: Run code checks and tests
        if: steps.release.outputs.needs_publish == 'true'
        shell: pwsh
        run: |
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Setup and Portable
        if: steps.release.outputs.needs_publish == 'true'
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Validate executables and updater metadata
        if: steps.release.outputs.needs_publish == 'true'
        shell: pwsh
        run: |
          ./scripts/verify-windows-artifacts.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/verify-update-feed.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify packaged desktop starts
        if: steps.release.outputs.needs_publish == 'true'
        run: node scripts/windows-app-smoke.cjs
      - name: Publish new release and auto-update manifest
        if: steps.release.outputs.needs_publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $assets = @(
            "dist/Baby-On-Screen-Setup-$env:VERSION-x64.exe",
            "dist/Baby-On-Screen-Portable-$env:VERSION-x64.exe",
            "dist/latest.yml"
          )
          $assets += @(Get-ChildItem -LiteralPath dist -Filter '*.blockmap' -File | ForEach-Object { $_.FullName })
          # Permanent names make /releases/latest/download/... valid after every version bump.
          # The versioned executables are retained for archives and latest.yml checksums.
          $shortcuts = @(
            @{ Source = "dist/Baby-On-Screen-Setup-$env:VERSION-x64.exe"; Name = 'Baby-On-Screen-Setup-x64.exe' },
            @{ Source = "dist/Baby-On-Screen-Portable-$env:VERSION-x64.exe"; Name = 'Baby-On-Screen-Portable-x64.exe' }
          )
          foreach ($item in $shortcuts) {
            if (-not (Test-Path -LiteralPath $item.Source -PathType Leaf)) {
              throw "Cannot make stable download alias: $($item.Source)"
            }
            $destination = Join-Path dist $item.Name
            Copy-Item -LiteralPath $item.Source -Destination $destination
            $assets += $destination
            if ((Get-FileHash -Algorithm SHA256 $item.Source).Hash -ne
                (Get-FileHash -Algorithm SHA256 $destination).Hash) {
              throw "Stable download alias differs from the versioned executable: $destination"
            }
          }
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) { throw "Missing release file: $asset" }
          }
          if ($env:VERSION -eq '0.0.3') {
            gh release create $env:RELEASE_TAG $assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Baby On Screen $env:VERSION" --notes-file docs/RELEASE_0.0.3.md --latest
          } else {
            gh release create $env:RELEASE_TAG $assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Baby On Screen $env:VERSION" --generate-notes --latest
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release publishing failed" }
      - name: Upload diagnostic artifacts if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: baby-update-debug-${{ github.sha }}
          path: |
            dist/*.yml
            dist/*.exe
            dist/*.blockmap
            dist/windows-*-smoke.png
          if-no-files-found: ignore
